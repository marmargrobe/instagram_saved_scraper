  deploy_transformations:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2 
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12.7'
  
    - name: SSH into EC2 and deploy transformations
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.EC2_PUBLIC_IP }}
        username: mars
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          git pull origin master
          python -m pip install --upgrade pip
          pip install -r src/data_cleaner/requirements.txt
          python -m src.data_cleaner.data_transformation
  deploy_categorization:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2 
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12.7'
  
    - name: SSH into EC2 and deploy categorization
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.EC2_PUBLIC_IP }}
        username: mars
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          git pull origin master
          python -m pip install --upgrade pip
          pip install -r src/data_cleaner/requirements.txt
          python -m src.data_cleaner.data_categorization