name: Deploy to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  deploy_scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
   
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12.7'
    
    - name: SSH into EC2 and deploy scraper
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.EC2_PUBLIC_IP }}
        username: mars
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          cd /path/to/scraper
          git pull origin master
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scraper.py  # Run the scraper

  deploy_transformer:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12.7'
  
    - name: SSH into EC2 and deploy transformer
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.EC2_PUBLIC_IP }}
        username: mars
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          cd /path/to/transformer
          git pull origin master
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python transformer.py  # Run the transformer