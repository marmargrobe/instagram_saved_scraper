# Checks that run on every `git commit` (install once: pre-commit install).
# They stop secrets and data files from being committed again.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files   # data and exports are far over 1 MB
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets            # passwords, API keys, tokens
        args: ["--baseline", ".secrets.baseline"]
